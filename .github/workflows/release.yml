# Builds the TraceFox disk image on a GitHub Mac.
#
#   Push a tag like v1.0.0  -> TraceFox.dmg, attached to a GitHub release
#   Run it by hand (Actions > Release > Run workflow) -> a DMG to download from the run page
#
# Signing: with the repository variable SIGN_RELEASES set to true (and the secrets described in
# docs/RELEASING.md), the app is signed with a Developer ID and notarized by Apple. Without it,
# the app is signed ad hoc, and macOS asks once before the first launch.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Read-only by default. Only the job below may write, and only to publish the release.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  dmg:
    name: Build the Mac disk image
    runs-on: macos-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      HAS_CERT: ${{ vars.SIGN_RELEASES == 'true' && secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check the tag against package.json
        if: env.IS_TAG == 'true'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match version $VERSION in package.json."
            exit 1
          fi

      - name: Stop a signed release without its secrets
        if: vars.SIGN_RELEASES == 'true' && env.HAS_CERT != 'true'
        run: |
          echo "::error::SIGN_RELEASES is true, but MACOS_CERTIFICATE_P12_BASE64 is missing. See docs/RELEASING.md."
          exit 1

      - name: Unit tests
        run: |
          npm ci
          npm test

      - name: Import the Developer ID certificate
        if: env.HAS_CERT == 'true'
        env:
          P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          # Optional. The certificate export is protected by GitHub's secret encryption; scripts/
          # export-certificate.command uses this fixed password so only one value has to be pasted.
          P12_PASSWORD: tracefox
        run: |
          KEYCHAIN="$RUNNER_TEMP/tracefox-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 24)
          echo "$P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm -f "$RUNNER_TEMP/certificate.p12"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        if: env.HAS_CERT == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -z "$APPLE_ID" ] || [ -z "$APPLE_TEAM_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ]; then
            echo "::error::APPLE_ID, APPLE_TEAM_ID or APPLE_APP_SPECIFIC_PASSWORD is missing. See docs/RELEASING.md."
            exit 1
          fi
          bash scripts/release-mac.sh

      - name: Build the disk image (ad-hoc signature)
        if: env.HAS_CERT != 'true'
        run: bash scripts/build-dmg.sh

      - name: Collect the disk image
        run: |
          mkdir -p dist
          cp out/TraceFox-*.dmg dist/TraceFox.dmg
          ls -lh dist
          shasum -a 256 dist/TraceFox.dmg | tee dist/TraceFox.dmg.sha256
          [ -f build.log ] && cp build.log dist/ || true

      - name: Keep the disk image with this run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TraceFox-dmg
          path: dist/
          retention-days: 14

      - name: Publish the GitHub release
        if: env.IS_TAG == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/TraceFox.dmg dist/TraceFox.dmg.sha256 --clobber
          else
            if [ "$HAS_CERT" = "true" ]; then
              echo "Signed with a Developer ID and notarized by Apple." > notes.md
            else
              {
                echo "**Opening TraceFox for the first time.** This version is not yet notarized by Apple, so macOS stops it once:"
                echo ""
                echo "1. Drag TraceFox into Applications and open it. macOS says it can't verify the app. Click **Done**."
                echo "2. Open **System Settings › Privacy & Security**, scroll down, and click **Open Anyway** next to TraceFox."
                echo "3. Confirm with your password. From then on TraceFox opens normally."
                echo ""
                echo "The download is built by GitHub Actions from the code in this repository. Its checksum is in \`TraceFox.dmg.sha256\`."
              } > notes.md
            fi
            gh release create "$GITHUB_REF_NAME" dist/TraceFox.dmg dist/TraceFox.dmg.sha256 \
              --title "TraceFox ${GITHUB_REF_NAME#v}" --notes-file notes.md --generate-notes
          fi

      - name: Remove the signing keychain
        if: always() && env.SIGN_KEYCHAIN != ''
        run: security delete-keychain "$SIGN_KEYCHAIN" || true
