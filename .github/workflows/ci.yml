# Runs on every change: unit tests, a full build of the Mac app, and the packaged app's
# self-test (page loads, storage works, no network, build-time switches locked).
# It has read-only access and uses no secrets, so it is safe for pull requests from forks.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Unit tests and known vulnerabilities
        run: |
          npm ci
          npm test
          npm audit --audit-level=high

      - name: Build the app and run its self-test
        run: bash scripts/build-dmg.sh
